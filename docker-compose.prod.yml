services:
  db:
    build:
      context: ./db
    container_name: rostering_db
    env_file:
      - ./db/.env
    # Host 5432 is taken by an unrelated local postgres container; the app reaches
    # db over the compose network (internal :5432), so this host mapping is only
    # for external/debug access.
    ports:
      - "5435:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostering -d rostering"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Vanilla PHP-FPM pool — the production backend. Owns the schema + reference
  # seed (bin/migrate.php + bin/seed.php run on boot, both idempotent), then
  # serves php-fpm on :9000 (reached by nginx over the compose network). The
  # marker file flips the healthcheck once the DB is prepared.
  server-vanilla:
    build:
      context: ./server-vanilla
    container_name: rostering_server_vanilla
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server-vanilla/.env
    volumes:
      - ./server-vanilla:/var/www
    command: ["sh", "/var/www/docker-start.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vanilla-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  # Vanilla worker daemon (the queue:work equivalent). Same image as
  # server-vanilla, but runs the worker loop; it processes the worker-CSV,
  # roster-generation, and roster-export job tables.
  server-vanilla-worker:
    build:
      context: ./server-vanilla
    container_name: rostering_server_vanilla_worker
    depends_on:
      db:
        condition: service_healthy
      server-vanilla:
        condition: service_healthy
    env_file:
      - ./server-vanilla/.env
    volumes:
      - ./server-vanilla:/var/www
    command: ["php", "/var/www/bin/worker.php"]
    restart: unless-stopped

  # Front-door gateway. Owns host :8000 (the port the SPA calls) and routes every
  # request to the vanilla FPM pool.
  nginx:
    image: nginx:1.27-alpine
    container_name: rostering_nginx
    depends_on:
      server-vanilla:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: rostering_client
    env_file:
      - ./client/.env
    # Served on host 5173 (matches the README and the printed prod URL).
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: ["sh", "/app/docker-start.prod.sh"]

volumes:
  client_node_modules:
