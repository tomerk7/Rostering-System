services:
  db:
    build:
      context: ./db
    container_name: rostering_db
    env_file:
      - ./db/.env
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostering -d rostering"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build:
      context: ./server
    container_name: rostering_server
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/var/www
      - server_vendor:/var/www/vendor

volumes:
  server_vendor:
