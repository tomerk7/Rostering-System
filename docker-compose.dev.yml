services:
  db:
    build:
      context: ./db
    container_name: rostering_db
    env_file:
      - ./db/.env
    ports:
      - "5433:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rostering -d rostering"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Vanilla PHP-FPM pool — the application backend. No host port —
  # nginx reaches it over the compose network on :9000.
  server-vanilla:
    build:
      context: ./server-vanilla
    container_name: rostering_server_vanilla
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server-vanilla/.env
    volumes:
      - ./server-vanilla:/var/www
    # Runs migrate + seed, then php-fpm. Marker file flips the healthcheck.
    command: ["sh", "/var/www/docker-start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vanilla-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  # Vanilla worker daemon (the queue:work equivalent for the vanilla pool). Same
  # image as server-vanilla, but runs the worker loop instead of php-fpm; it
  # processes CSV import/export jobs from the worker_csv_jobs table.
  server-vanilla-worker:
    build:
      context: ./server-vanilla
    container_name: rostering_server_vanilla_worker
    depends_on:
      db:
        condition: service_healthy
      # Wait until the vanilla app has migrated/seeded the schema.
      server-vanilla:
        condition: service_healthy
    env_file:
      - ./server-vanilla/.env
    volumes:
      - ./server-vanilla:/var/www
    command: ["php", "/var/www/bin/worker.php"]
    restart: unless-stopped

  # Front-door gateway: routes every request to the vanilla FPM pool.
  # Owns the host :8000 the client already uses.
  nginx:
    image: nginx:1.27-alpine
    container_name: rostering_nginx
    depends_on:
      - server-vanilla
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: rostering_client
    env_file:
      - ./client/.env
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: ["sh", "/app/docker-start.dev.sh"]

volumes:
  client_node_modules:
