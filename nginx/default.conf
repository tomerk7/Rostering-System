# Front-door gateway for the strangler-fig migration.
#
# nginx owns port 80 (published as host :8000). By default every request is
# proxied to the existing Laravel app (`server`, an `artisan serve` HTTP server).
# Routes are migrated to the vanilla PHP-FPM pool (`server-vanilla`) one at a
# time by adding a more specific `location` that uses fastcgi_pass — nginx
# matches the most specific location, so carve-outs win over the catch-all.

server {
    listen 80;
    server_name _;

    # Proof-of-life for the vanilla FPM pool: nginx -> php-fpm -> Postgres.
    location = /__vanilla/health {
        include fastcgi_params;
        fastcgi_pass server-vanilla:9000;
        # Resolved inside the FPM container's filesystem, not nginx's.
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    }

    # Auth is owned by the vanilla app (JWT). Carve the whole /api/auth/ prefix
    # to the vanilla FPM pool; its front controller routes by REQUEST_URI.
    location ^~ /api/auth/ {
        include fastcgi_params;
        fastcgi_pass server-vanilla:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    }

    # Workers: migrating endpoint by endpoint. Exact-match carve-outs so the
    # still-on-Laravel workers/* routes (CRUD, import/export) keep falling
    # through to the catch-all below until they're moved too.
    location = /api/workers/reference-data {
        include fastcgi_params;
        fastcgi_pass server-vanilla:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    }

    # Default: everything else still goes to Laravel, unchanged.
    location / {
        proxy_pass http://server:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FUTURE — migrate a route by pointing it at the vanilla pool, e.g.:
    #
    # location = /api/rosters/distribution-preview {
    #     include fastcgi_params;
    #     fastcgi_pass server-vanilla:9000;
    #     fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    #     fastcgi_param REQUEST_METHOD  $request_method;
    # }
}
