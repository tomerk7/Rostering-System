# Front-door gateway — strangler-fig migration COMPLETE.
#
# Auth, workers, and rosters are all served by the vanilla PHP-FPM pool
# (`server-vanilla`). The catch-all now sends EVERY request to vanilla, so
# nothing falls through to the legacy Laravel app anymore. Laravel remains in the
# compose stack only as a dormant fallback reachable directly on its own port
# (:8001) for debugging/rollback and for CLI commands (artisan) — nginx no longer
# routes any traffic to it.
#
# nginx owns port 80 (published as host :8000), the port the SPA already calls.

server {
    listen 80;
    server_name _;

    # CSV import accepts up to a 10 MB upload; give headroom above it.
    client_max_body_size 12m;

    # Everything goes to the vanilla FPM pool. Its front controller
    # (public/index.php) routes by REQUEST_URI and returns a JSON 404 for
    # anything it doesn't know.
    location / {
        include fastcgi_params;
        fastcgi_pass server-vanilla:9000;
        # Resolved inside the FPM container's filesystem, not nginx's.
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    }
}
